name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell tooling
        run: |
          brew install bash shellcheck shfmt
          BREW_PREFIX="$(brew --prefix)"
          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/sbin" >> "$GITHUB_PATH"

      - name: Show tooling versions
        run: |
          bash --version | head -n 1
          shellcheck --version
          shfmt --version

      - name: Bash syntax checks
        run: |
          bash -n scripts/install.sh
          bash -n scripts/doctor.sh
          bash -n scripts/test-install-flags.sh
          bash -n scripts/test-doctor-flags.sh

      - name: ShellCheck
        run: shellcheck -x scripts/install.sh scripts/doctor.sh scripts/test-install-flags.sh scripts/test-doctor-flags.sh

      - name: shfmt diff check
        run: shfmt -d scripts/install.sh scripts/doctor.sh scripts/test-install-flags.sh scripts/test-doctor-flags.sh

      - name: shell smoke tests
        run: |
          bash scripts/test-install-flags.sh
          bash scripts/test-doctor-flags.sh

      - name: doctor non-interactive checks
        run: |
          TEMP_HOME="$(mktemp -d)"
          HOME="$TEMP_HOME" bash scripts/doctor.sh --non-interactive
          HOME="$TEMP_HOME" bash scripts/doctor.sh --fix --dry-run --non-interactive
